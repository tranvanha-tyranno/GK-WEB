services:
  app:
    build: .
    env_file: .env
    volumes:
      - .:/app
      - chat-data:/app/storage
    restart: unless-stopped
  ws:
    build: .
    env_file: .env
    volumes:
      - .:/app
      - chat-data:/app/storage
    command: ["php", "bin/ws-server.php", "start"]
    init: true
    restart: unless-stopped
    depends_on:
      - app
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/app:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - ws
    restart: unless-stopped
volumes:
  chat-data:
