services:
  app:
    image: gk-web-app
    environment:
      APP_ENV: test
      APP_URL: http://localhost:8088
      DATABASE_PATH: /app/storage/integration.sqlite
      SESSION_SECRET: integration-only-not-a-production-secret-503073
      ORIGIN_ALLOWLIST: http://localhost:8088
      BENCHMARK_ENABLED: "1"
    volumes: ["..:/app", "test-data:/app/storage"]
  ws:
    image: gk-web-ws
    environment:
      APP_ENV: test
      APP_URL: http://localhost:8088
      DATABASE_PATH: /app/storage/integration.sqlite
      SESSION_SECRET: integration-only-not-a-production-secret-503073
      ORIGIN_ALLOWLIST: http://localhost:8088
      WS_HOST: 0.0.0.0
      WS_PORT: 8081
    volumes: ["..:/app", "test-data:/app/storage"]
    command: ["php", "bin/ws-server.php", "start"]
    init: true
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ..:/app:ro
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app, ws]
volumes:
  test-data:
